services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
       - ./:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://pitchflow.devifyo.cloud
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=connectflow_reverb
      - REVERB_PORT=6001
      - REVERB_SCHEME=http
    entrypoint: >
      sh -c "chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache 2>/dev/null; true &&
             npm install && npm run build &&
             supervisord -c /etc/supervisord.conf"
    networks:
      - connectflow_default
    depends_on:
      db:
        condition: service_healthy

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectflow_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
       - ./:/var/www/html
    environment:
      - APP_ENV=production
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=6001
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=6001
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    entrypoint: ["php", "artisan", "reverb:start"]
    networks:
      - connectflow_default
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: connectflow_web
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8009:80"
    networks:
      - connectflow_default
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: connectflow_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - connectflow_db_data:/var/lib/mysql
    networks:
      - connectflow_default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: connectflow_pma
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_ABSOLUTE_URI=https://pitchflow.devifyo.cloud/dbase/
    ports:
      - "8084:80"
    networks:
      - connectflow_default
    depends_on:
      - db

  deepstack:
    image: deepquestai/deepstack:latest
    container_name: connectflow_deepstack
    restart: unless-stopped
    environment:
      - VISION-FACE=True
    volumes:
      - connectflow_deepstack_data:/datastore
    networks:
      - connectflow_default

volumes:
  connectflow_db_data:
  connectflow_deepstack_data:

networks:
  connectflow_default:
    driver: bridge
