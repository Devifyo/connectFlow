services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
       - ./:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8009
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=localhost
      - REVERB_PORT=6001
    entrypoint: >
      sh -c "chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache 2>/dev/null; true &&
             npm install && npm run build &&
             php-fpm"
    networks:
      - connectflow_default
    depends_on:
      - db

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectflow_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
       - ./:/var/www/html
    environment:
      - APP_ENV=production
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=6001
      - REVERB_SSL_LOCAL_KEY=/etc/ssl/private/key.pem
      - REVERB_SSL_LOCAL_CERT=/etc/ssl/certs/cert.pem
    entrypoint: ["php", "artisan", "reverb:start"]
    networks:
      - connectflow_default

  nginx:
    image: nginx:alpine
    container_name: connectflow_web
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8009:80"
    networks:
      - connectflow_default
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: connectflow_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - connectflow_db_data:/var/lib/mysql
    networks:
      - connectflow_default

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: connectflow_pma
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_ABSOLUTE_URI=http://localhost:8009/dbase/
    ports:
      - "8084:80"
    networks:
      - connectflow_default
    depends_on:
      - db

volumes:
  connectflow_db_data:

networks:
  connectflow_default:
    driver: bridge